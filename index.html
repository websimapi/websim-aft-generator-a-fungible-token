<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFT Generator - A Fungible Token</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-gradient"></div>
    
    <header class="header">
        <div class="container">
            <h1 class="logo">
                <span class="logo-text">AFT</span>
                <span class="logo-subtitle">A Fungible Token</span>
            </h1>
            <div class="header-stats">
                <div class="stat">
                    <span class="stat-number" id="totalAfts">0</span>
                    <span class="stat-label">AFTs Created</span>
                </div>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <section class="gallery-section">
                <h2 class="section-title">AFTs from Comments</h2>
                <p class="section-description">
                    AFTs are automatically generated from comments left on this project!
                </p>
                <div class="gallery-grid" id="galleryGrid">
                    <div class="empty-state">
                        <div class="empty-icon">🎨</div>
                        <h3>No AFTs Yet</h3>
                        <p>Create your first AFT by entering a comment above!</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div class="modal" id="aftModal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-body">
                <img class="modal-image" id="modalImage" alt="AFT">
                <div class="modal-info">
                    <h3 class="modal-title" id="modalTitle">AFT #001</h3>
                    <p class="modal-comment" id="modalComment"></p>
                    <div class="modal-metadata">
                        <div class="metadata-item">
                            <span class="metadata-label">Created:</span>
                            <span class="metadata-value" id="modalDate"></span>
                        </div>
                        <div class="metadata-item">
                            <span class="metadata-label">Author:</span>
                            <span class="metadata-value" id="modalAuthor"></span>
                        </div>
                        <div class="metadata-item">
                            <span class="metadata-label">Uniqueness:</span>
                            <span class="metadata-value">100% Original</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "@websim/websim-socket": "https://esm.websim.com/@websim/websim-socket"
        }
    }
    </script>
    <script type="module" src="script.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
